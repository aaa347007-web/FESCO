name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle & Maven Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/package-lock.json', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/browser @capacitor/assets @capacitor-community/admob --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Official FESCO Launcher Icons
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 -c '
          from PIL import Image
          import os

          img = Image.open("app-icon.png").convert("RGBA")
          w, h = img.size
          margin = int(min(w, h) * 0.13)
          cropped = img.crop((margin, margin, w - margin, h - margin))

          os.makedirs("assets", exist_ok=True)
          cropped.resize((1024, 1024), Image.LANCZOS).save("assets/icon-only.png", "PNG")

          fg = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          inner = cropped.resize((720, 720), Image.LANCZOS)
          fg.paste(inner, (152, 152), inner)
          fg.save("assets/icon-foreground.png", "PNG")

          bg = Image.new("RGBA", (1024, 1024), (15, 76, 58, 255))
          bg.save("assets/icon-background.png", "PNG")
          '
          npx capacitor-assets generate --android

      - name: Add Native Plugins (Downloads + Offline OCR + AdMob) & Configure Signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > android/app/fesco-release.keystore

          sed -i 's|mavenCentral()|maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }\n        mavenCentral()|g' android/build.gradle android/settings.gradle 2>/dev/null || true

          # Inject Real AdMob App ID into AndroidManifest.xml
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4460360638178090~7079659952"/>\n    </application>|g' android/app/src/main/AndroidManifest.xml

          PKG_DIR=$(find android/app/src/main/java -name "MainActivity.java" -exec dirname {} \;)
          PKG_NAME=$(grep "^package " "$PKG_DIR/MainActivity.java" | sed 's/package //;s/;//')

          cat << EOF > "$PKG_DIR/PublicDownloadPlugin.java"
          package ${PKG_NAME};

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "PublicDownload")
          public class PublicDownloadPlugin extends Plugin {
              @PluginMethod
              public void saveFile(PluginCall call) {
                  String filename = call.getString("filename", "backup.json");
                  String base64Data = call.getString("base64Data");
                  String mimeType = call.getString("mimeType", "application/octet-stream");
                  if (base64Data == null) {
                      call.reject("Missing base64Data");
                      return;
                  }
                  try {
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              try (OutputStream out = getContext().getContentResolver().openOutputStream(uri)) {
                                  out.write(bytes);
                              }
                          }
                      } else {
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          if (!dir.exists()) dir.mkdirs();
                          File file = new File(dir, filename);
                          try (FileOutputStream fos = new FileOutputStream(file)) {
                              fos.write(bytes);
                          }
                      }
                      JSObject ret = new JSObject();
                      ret.put("saved", true);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }
          }
          EOF

          cat << EOF > "$PKG_DIR/BillOcrPlugin.java"
          package ${PKG_NAME};

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;

          @CapacitorPlugin(name = "BillOcr")
          public class BillOcrPlugin extends Plugin {
              @PluginMethod
              public void scanImage(PluginCall call) {
                  String base64Data = call.getString("base64Data");
                  if (base64Data == null || base64Data.isEmpty()) {
                      call.reject("Missing image data");
                      return;
                  }
                  try {
                      byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                      Bitmap bitmap = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      if (bitmap == null) {
                          call.reject("Invalid image");
                          return;
                      }
                      InputImage image = InputImage.fromBitmap(bitmap, 0);
                      TextRecognizer recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      recognizer.process(image)
                          .addOnSuccessListener(visionText -> {
                              JSObject ret = new JSObject();
                              ret.put("text", visionText.getText());
                              call.resolve(ret);
                          })
                          .addOnFailureListener(e -> call.reject(e.getMessage()));
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }
          }
          EOF

          cat << EOF > "$PKG_DIR/MainActivity.java"
          package ${PKG_NAME};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PublicDownloadPlugin.class);
                  registerPlugin(BillOcrPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle
          cat << EOF >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("fesco-release.keystore")
                      storePassword "${KEY_STORE_PASSWORD}"
                      keyAlias "${KEY_ALIAS}"
                      keyPassword "${KEY_PASSWORD}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          configurations.all {
              resolutionStrategy {
                  force("androidx.browser:browser:1.8.0")
              }
          }

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("androidx.browser:browser:1.8.0")
          }
          EOF

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FESCO-Bills-Manager-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
